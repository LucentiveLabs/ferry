# Gitleaks config for the ferry security gate (from the security-gate baseline).
# Lives at the repo root as `.gitleaks.toml` (gitleaks auto-loads it). Extends
# gitleaks' default ruleset and adds a tight false-positive allowlist. Keep the
# allowlist NARROW — only patterns proven safe — so real secrets are never
# suppressed.
title = "@lucentive-labs/ferry security gate"

[extend]
useDefault = true

# curl / HTTP basic-auth where the credential is a shell/env variable, e.g.
#   curl -u "$STRIPE_SK:"   curl -u "${TOKEN}:"
# The secret is injected from the environment (op:// / CI secret), never a
# committed literal, so this is a false positive for the curl-auth-user rule.
# Scoped TWO ways so it can only silence this exact FP shape: targetRules pins it
# to curl-auth-user, and regexTarget="secret" with an ANCHORED env-var regex means
# the allowed secret must BE an env-var reference. A line-wide allow (no targetRules,
# regexTarget="line") is global and would suppress a real literal credential merely
# sharing the curl line (gitleaks 8.30.1: tight form catches 6/6 planted secrets,
# the line form only 4/6).
[[allowlists]]
description = "curl basic-auth via env/shell variable (not a literal secret)"
targetRules = ["curl-auth-user"]
regexTarget = "secret"
regexes = ['''^["']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?:?["']?$''']

# NO directory-wide fixture/scratch allowlist: a broad path allow could hide a
# REAL committed secret. Full mode scans git history (gitignored scratch/ never
# appears there), so it isn't needed. A repo with deliberate synthetic-secret
# fixtures should ship its own .gitleaks.toml with exact fingerprints/regexes for
# those specific fake values rather than allowlisting whole directories.
